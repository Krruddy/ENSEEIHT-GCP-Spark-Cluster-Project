name: Configure Spark

on:
  workflow_run:
    workflows: [Deploy Infrastructure]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: 'enseeiht-spark-lab'
  LOCATION: 'europe-west1'
  PROJECT_NUMBER: '177424230750'
  SERVICE_ACCOUNT_ID: 'github-actions-sa'
  #SERVICE_ACCOUNT_EMAIL: '${{ env.SERVICE_ACCOUNT_ID }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
  SERVICE_ACCOUNT_EMAIL: 'github-actions-sa@enseeiht-spark-lab.iam.gserviceaccount.com'
  WORKLOAD_IDENTITY_POOL_ID: 'github-pool'
  WORKLOAD_IDENTITY_PROVIDER_ID: 'github-provider'
  #WORKLOAD_IDENTITY_PROVIDER: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WORKLOAD_IDENTITY_POOL_ID }}/providers/${{ env.WORKLOAD_IDENTITY_PROVIDER_ID }}'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/177424230750/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

jobs:
  deploy-ansible:
    name: Deploy Ansible Playbook
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - id: 'auth'
        name: 'Authenticate to GCP'
        uses: 'google-github-actions/auth@v1'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT_EMAIL }}'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible requests google-auth

      - name: Set SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY_ANSIBLE_RUNNER }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Install Ansible
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y ansible
